# GitHub Actions mirror of .gitea/workflows/ci.yml (dual-platform CI parity).
# Keep in sync with the .gitea copy -- patch both in the same PR.
#
# Jobs mirrored : secret-scan, lint, dependency-scan, verify (all portable)
#
# Translation vs .gitea/workflows/ci.yml:
#   - Guard       : every job carries `if: github.server_url == 'https://github.com'` so a
#                   Gitea instance that also reads .github/workflows never double-runs jobs
#   - PowerShell  : ubuntu-latest ships pwsh -- "Install PowerShell" tarball step removed
#   - .NET SDK    : actions/setup-dotnet@v4 replaces the curl dotnet-install.sh block
#
# PREREQUISITE: the lint, verify, and dependency-scan jobs call scripts from the Common
# submodule (ext/Lidarr.Plugin.Common) -- see the .gitea copy's header note.
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  secret-scan:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Gitleaks secret scan
        shell: bash
        run: |
          set -euo pipefail
          GITLEAKS_SHA256=ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --no-banner --redact --exit-code 1

  lint:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Common submodule pin guard
        shell: bash
        run: bash ext/Lidarr.Plugin.Common/scripts/repin-common-submodule.sh --verify-only --path ext/Lidarr.Plugin.Common
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Common lint gates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runner = './ext/Lidarr.Plugin.Common/scripts/ci/run-plugin-lint-gates.ps1'
          if (-not (Test-Path $runner)) {
            Write-Error "Shared lint runner not found: $runner"
            exit 1
          }
          $global:LASTEXITCODE = 0
          & $runner -RepoPath . -CommonRoot ext/Lidarr.Plugin.Common -Mode ci
          $runnerExitCode = if ($null -eq $global:LASTEXITCODE) { 0 } else { [int]$global:LASTEXITCODE }
          exit $runnerExitCode

  dependency-scan:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # && chaining: a failing invocation must fail the step.
      - name: Dependency-CVE gate (fail on High+, direct + transitive)
        shell: pwsh
        run: |
          ./ext/Lidarr.Plugin.Common/scripts/ci/check-vulnerable-packages.ps1 -Target src/MyPlugin/MyPlugin.csproj && `
          ./ext/Lidarr.Plugin.Common/scripts/ci/check-vulnerable-packages.ps1 -Target tests/MyPlugin.Tests/MyPlugin.Tests.csproj

  verify:
    if: ${{ github.server_url == 'https://github.com' }}
    needs: [lint, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Common submodule pin guard
        shell: bash
        run: bash ext/Lidarr.Plugin.Common/scripts/repin-common-submodule.sh --verify-only --path ext/Lidarr.Plugin.Common
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # Scaffold verification: build + full test suite (includes the ecosystem parity
      # suite). Graduate to Common's shared local-ci pipeline once host packaging is
      # wired (see the .gitea copy's note).
      - name: Build (Release)
        run: dotnet build src/MyPlugin/MyPlugin.csproj -c Release -p:LidarrPluginCommonRepoRoot=$PWD/ext/Lidarr.Plugin.Common
      - name: Test (Release)
        run: dotnet test tests/MyPlugin.Tests/MyPlugin.Tests.csproj -c Release -p:LidarrPluginCommonRepoRoot=$PWD/ext/Lidarr.Plugin.Common
